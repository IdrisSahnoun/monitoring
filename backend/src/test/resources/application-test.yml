spring:
  application:
    name: vehicle-diagnostic-monitoring-test
  
  datasource:
    url: jdbc:h2:mem:test_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  data:
    redis:
      host: localhost
      port: 6379

azure:
  application-insights:
    instrumentation-key: test-key
    connection-string: InstrumentationKey=test-key
    enabled: false

monitoring:
  cache:
    enabled: false

logging:
  level:
    root: INFO
    com.vehicle.diagnostic: DEBUG
